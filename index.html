button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.95rem;padding:.62em .75em;

input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--schimmer)}
input[type=date]{color-scheme:light}
input[readonly]{background:#f1f3f5;color:var(--leise)}
a{color:var(--orange)}
.fehler{color:var(--rot);font-size:.88rem;min-height:1.2em;margin:.4em 0 0}
.erfolg{background:var(--gruen-bg);color:var(--gruen);padding:.9em 1.1em;border-radius:10px;

.leer{color:var(--leise);font-size:.9rem;line-height:1.55}

<script>

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDatum(iso){
  if(!iso) return '—';
  const [j,m,t] = String(iso).slice(0,10).split('-');
  return `${t}.${m}.${j}`;
}
function formatZahl(n, stellen=1){
  return Number(n ?? 0).toLocaleString('de-AT',{ maximumFractionDigits: stellen });
}
function heuteIso(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDatumFlex(wert){
  if(wert === null || wert === undefined || wert === '') return null;
  if(wert instanceof Date && !isNaN(wert))
    return `${wert.getFullYear()}-${String(wert.getMonth()+1).padStart(2,'0')}-${String(wert.getDate()).padStart(2,'0')}`;
  const s = String(wert).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[.,/](\d{1,2})[.,/](\d{2,4})$/);
  if(m){ let [,t,mo,j] = m; if(j.length===2) j='20'+j;
    return `${j.padStart(4,'0')}-${mo.padStart(2,'0')}-${t.padStart(2,'0')}`; }
  return null;
}
function werktageZaehlen(vonIso, bisIso){
  const von = new Date(vonIso+'T00:00:00Z'), bis = new Date(bisIso+'T00:00:00Z');
  if(isNaN(von) || isNaN(bis) || bis < von) return 0;
  let n = 0; const d = new Date(von);
  while(d <= bis){
    const tag = d.getUTCDay(), iso = d.toISOString().slice(0,10);
    if(tag !== 0 && tag !== 6 && !feiertage.has(iso)) n++;
    d.setUTCDate(d.getUTCDate()+1);
  }
  return n;
}

  const { data:{ session } } = await sb.auth.getSession();
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/${funktion}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
    body: JSON.stringify(nutzdaten)
  });
  const ergebnis = await resp.json().catch(() => ({ error:'Unlesbare Antwort vom Server' }));
  if(!resp.ok || ergebnis.error) throw new Error(ergebnis.error || `Fehler ${resp.status}`);
  return ergebnis;
}

  return new Promise((ja, nein) => {
    const leser = new FileReader();

}

document.querySelectorAll('#rollen-umschalter button').forEach(b => {

});

  e.preventDefault();
  const fehler = $('login-fehler-mitarbeiter'); fehler.textContent = '';

  if(code.length <= 6){ fehler.textContent = 'Der Code ist zu kurz.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({
    email: `ma${code.slice(0,-6)}@dienst.intern`, password: code.slice(-6)

  await angemeldet(data.user);
});

  if(error){ fehler.textContent = 'Anmeldung fehlgeschlagen: ' + error.message; return; }
  await angemeldet(data.user);
});

  const { data: a } = await sb.from('abteilungen').select('name').order('name');

const TABS_VERWALTER = [['start','Start'],['antraege','Anträge'],['kalender','Kalender'],

  $('tabs').innerHTML = tabs.map(([id,l]) => `<button data-tab="${id}">${l}</button>`).join('');

  scannerStoppen();
  $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('tab-aktiv', b.dataset.tab===name));
  $('inhalt').innerHTML = '<p class="leer">Lade …</p>';
  ({ start:renderStart, antraege:renderAntraege, kalender:renderKalender, mitarbeiter:renderMitarbeiter,
     auswertung:renderAuswertung, dokument:renderDokument, feiertage:renderFeiertage })[name]?.();

  const [{ data: leute }, { data: offene }, { data: abw }] = await Promise.all([

// Der Anspruch wächst täglich mit. Deshalb zählt der Stand am Ende des
// beantragten Zeitraums, nicht der von heute.
function verfuegbarerUrlaub(bisIso){
  if(!meinKonto) return 0;
  const stichtag = bisIso ? new Date(bisIso+'T00:00:00Z') : new Date();
  const eintritt = new Date(meinKonto.eintrittsdatum+'T00:00:00Z');
  const tage = Math.max(0, Math.floor((stichtag - eintritt)/86400000));
  return tage/30*Number(meinKonto.urlaubssatz) + Number(meinKonto.kontokorrektur||0)
       - Number(meinKonto.konsumiert||0) - Number(meinKonto.offen_urlaub||0);
}

function zeigeUrlaubsgrenze(bisIso, beantragt){
  const el = $('an-konto'), knopf = $('an-knopf');
  if(!el) return;
  const frei = verfuegbarerUrlaub(bisIso);
  const zuviel = beantragt > frei + 0.001;
  el.classList.toggle('zuviel', zuviel);
  el.innerHTML = `<span class="gross">${formatZahl(frei)}</span>
    <span class="leer">Urlaubstage ${bisIso ? 'bis zum '+formatDatum(bisIso) : 'Stand heute'} verfügbar</span>
    ${Number(meinKonto?.offen_urlaub) > 0 ? `<span class="leer">· ${formatZahl(meinKonto.offen_urlaub)} Tage bereits beantragt und offen</span>` : ''}
    ${zuviel ? `<span style="color:var(--rot);font-weight:600">· ${formatZahl(beantragt-frei)} Tage zu viel</span>` : ''}`;
  if(knopf) knopf.disabled = zuviel || beantragt <= 0;
}

async function antragAbsenden(e){
  e.preventDefault();
  const fehler = $('an-fehler'); fehler.textContent = '';
  const von = $('an-von').value, bis = $('an-bis').value;
  const werktage = werktageZaehlen(von, bis);
  if(werktage <= 0){ fehler.textContent = 'In diesem Zeitraum liegt kein Werktag.'; return; }
  if(werktage > verfuegbarerUrlaub(bis) + 0.001){ fehler.textContent = 'Dafür reicht dein Urlaubskonto nicht.'; return; }
  const { error } = await sb.from('abwesenheiten').insert({
    mitarbeiter_id: meinKonto.id, art:'Urlaub', von, bis, werktage,
    kommentar: $('an-kommentar').value.trim() || null, status:'offen' });
  if(error){ fehler.textContent = error.message; return; }
  $('antrag-form').reset(); $('an-werktage').value = 0;
  await ladeGrunddaten();
  zeigeUrlaubsgrenze('', 0);
  await ladeEigeneAntraege();
}

  const { data, error } = await sb.from('abwesenheiten').select('*')

/* ===================== Scanner ===================== */

let scanStrom = null, scanBlob = null;

function scannerStoppen(){
  if(scanStrom){ scanStrom.getTracks().forEach(t => t.stop()); scanStrom = null; }
}

function scannerBereitstellen(){
  $('scan-bereich').innerHTML = `
    <div class="scan-knoepfe">
      <button class="knopf" type="button" id="scan-start">Kamera öffnen</button>
      <button class="knopf sekundaer" type="button" id="scan-datei-knopf">Bild oder PDF auswählen</button>
      <input id="scan-datei" type="file" accept="image/*,.pdf" hidden>
    </div>`;
  $('scan-start').addEventListener('click', kameraOeffnen);
  $('scan-datei-knopf').addEventListener('click', () => $('scan-datei').click());
  $('scan-datei').addEventListener('change', e => {
    const d = e.target.files[0];
    if(d){ scanBlob = d; belegAuswerten(d); }
  });
}

async function kameraOeffnen(){
  const fehler = $('krank-fehler'); fehler.textContent = '';
  try {
    scanStrom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1440 } }
    });
  } catch(err){
    fehler.textContent = 'Kamera nicht verfügbar (' + err.name + '). Nimm „Bild oder PDF auswählen".';
    return;
  }
  $('scan-bereich').innerHTML = `
    <div class="scanner">
      <video id="scan-video" playsinline muted></video>
      <div class="scan-rahmen"></div>
      <div class="scan-hinweis">Krankmeldung in den Rahmen legen und auslösen</div>
    </div>
    <div class="scan-knoepfe">
      <button class="knopf" type="button" id="scan-ausloesen">Aufnehmen</button>
      <button class="knopf sekundaer" type="button" id="scan-abbrechen">Abbrechen</button>
    </div>`;
  const video = $('scan-video');
  video.srcObject = scanStrom;
  await video.play().catch(() => {});
  $('scan-ausloesen').addEventListener('click', bildAufnehmen);
  $('scan-abbrechen').addEventListener('click', () => { scannerStoppen(); scannerBereitstellen(); });
}

async function bildAufnehmen(){
  const video = $('scan-video');
  const leinwand = document.createElement('canvas');
  leinwand.width = video.videoWidth || 1280;
  leinwand.height = video.videoHeight || 960;
  leinwand.getContext('2d').drawImage(video, 0, 0, leinwand.width, leinwand.height);
  scanBlob = await new Promise(r => leinwand.toBlob(r, 'image/jpeg', 0.9));
  scannerStoppen();

  $('scan-bereich').innerHTML = `
    <div class="scanner"><img id="scan-vorschau" src="${URL.createObjectURL(scanBlob)}" alt="Aufnahme"></div>
    <div class="scan-knoepfe">
      <button class="knopf" type="button" id="scan-verwenden">Diese Aufnahme verwenden</button>
      <button class="knopf sekundaer" type="button" id="scan-nochmal">Nochmal aufnehmen</button>
    </div>`;
  $('scan-nochmal').addEventListener('click', kameraOeffnen);
  $('scan-verwenden').addEventListener('click', () => belegAuswerten(scanBlob));
}

async function belegAuswerten(datei){
  const fehler = $('krank-fehler');
  fehler.textContent = ''; $('krank-ergebnis').innerHTML = '';
  const knopf = $('scan-verwenden') || $('scan-datei-knopf');
  if(knopf){ knopf.disabled = true; knopf.textContent = 'Lese Zeitraum …'; }
  try {
    const erkannt = await edgeAufruf('hyper-handler', {
      dateiBase64: await dateiZuBase64(datei), mediaType: datei.type || 'image/jpeg' });
    const von = erkannt.datum_von || heuteIso();
    const bis = erkannt.datum_bis || von;
    $('krank-ergebnis').innerHTML = `
      <div class="block" style="margin:1.2em 0 0;background:var(--karte-hoch)">
        <p class="leer" style="margin-top:0">${erkannt.quelle ? esc(erkannt.quelle)+'. ' : ''}Bitte den Zeitraum prüfen.</p>
        <div class="formular-reihe">
          <div class="feld"><label>Krank von</label><input id="krank-von" type="date" value="${esc(von)}"></div>
          <div class="feld"><label>Krank bis</label><input id="krank-bis" type="date" value="${esc(bis)}"></div>
          <div class="feld"><label>Werktage</label><input id="krank-werktage" readonly style="width:5.5em" class="zahl"></div>
          <button class="knopf" type="button" id="krank-senden">Krankmeldung senden</button>
        </div>
        <p class="fehler" id="krank-send-fehler"></p>
      </div>`;
    const rechnen = () => {
      const v = $('krank-von').value, b = $('krank-bis').value;
      $('krank-werktage').value = (v && b) ? werktageZaehlen(v,b) : 0;
    };
    rechnen();
    $('krank-von').addEventListener('change', rechnen);
    $('krank-bis').addEventListener('change', rechnen);
    $('krank-senden').addEventListener('click', () => krankmeldungSenden(datei));
  } catch(err){
    fehler.textContent = 'Auswerten fehlgeschlagen: ' + err.message;
  } finally {
    if(knopf){ knopf.disabled = false; knopf.textContent = knopf.id==='scan-verwenden' ? 'Diese Aufnahme verwenden' : 'Bild oder PDF auswählen'; }
  }
}

async function krankmeldungSenden(datei){
  const fehler = $('krank-send-fehler'); fehler.textContent = '';
  const knopf = $('krank-senden');
  knopf.disabled = true; knopf.textContent = 'Sende …';
  try {
    const von = $('krank-von').value, bis = $('krank-bis').value || $('krank-von').value;
    const werktage = werktageZaehlen(von, bis);
    if(werktage <= 0) throw new Error('In diesem Zeitraum liegt kein Werktag.');

    const endung = (datei.type === 'application/pdf') ? 'pdf' : 'jpg';
    const pfad = `${meinKonto.id}/${Date.now()}.${endung}`;
    const { error: ladefehler } = await sb.storage.from('krankmeldungen')
      .upload(pfad, datei, { contentType: datei.type || 'image/jpeg' });
    if(ladefehler) throw new Error('Bild konnte nicht hochgeladen werden: ' + ladefehler.message);

    const { error } = await sb.from('abwesenheiten').insert({
      mitarbeiter_id: meinKonto.id, art:'Krank', von, bis, werktage, status:'offen', beleg_pfad: pfad });
    if(error) throw new Error(error.message);

    $('krank-ergebnis').innerHTML = `<div class="erfolg">Krankmeldung samt Aufnahme wurde übermittelt.</div>`;
    scanBlob = null;
    scannerBereitstellen();
    await ladeEigeneAntraege();
  } catch(err){
    fehler.textContent = err.message;
    knopf.disabled = false; knopf.textContent = 'Krankmeldung senden';
  }
}

let antragsDaten = [], personenNachId = new Map();

// Urlaubskonto zum Ende des beantragten Zeitraums – also der Stand, den der
// Mitarbeiter hätte, wenn dieser Antrag genehmigt wird. Der Anspruch wächst
// täglich mit, deshalb zählt nicht der heutige Stand.
function kontoNachAntrag(a){
  const m = personenNachId.get(a.mitarbeiter_id);
  if(!m || a.art !== 'Urlaub') return null;
  const tage = Math.max(0, Math.floor(
    (new Date(a.bis+'T00:00:00Z') - new Date(m.eintrittsdatum+'T00:00:00Z')) / 86400000));
  const anspruch = tage/30*Number(m.urlaubssatz) + Number(m.kontokorrektur||0);
  const verbraucht = Number(m.konsumiert||0) + (a.status === 'genehmigt' ? 0 : Number(a.werktage));
  return anspruch - verbraucht;
}

async function ladeAlleAntraege(){
  let q = sb.from('abwesenheiten')

    q, sb.from('mitarbeiter_uebersicht').select('id,vollername,abteilung,eintrittsdatum,urlaubssatz,kontokorrektur,konsumiert')
  ]);
  personenNachId = new Map((leute||[]).map(m => [m.id, m]));
  antragsDaten = data || [];

  const ziel = $('antraege-liste');
  if(error){ ziel.innerHTML = `<p class="fehler">${esc(error.message)}</p>`; return; }
  if(!data.length){ ziel.innerHTML = '<p class="leer">Keine Anträge.</p>'; return; }

  ziel.innerHTML = `<div class="tabelle-wrapper"><table>
    <thead><tr><th>Mitarbeiter</th><th>Abteilung</th><th>Art</th><th>Von</th><th>Bis</th>
      <th class="rechts">Werktage</th><th class="rechts">Konto danach</th><th>Beleg</th><th>Status</th><th></th></tr></thead>
    <tbody>${data.map(a => {
      const konto = kontoNachAntrag(a);
      const minus = konto !== null && konto < -0.001;
      return `<tr>
      <td>${esc(a.mitarbeiter ? a.mitarbeiter.vorname+' '+a.mitarbeiter.nachname : '—')}</td>

/* ---------- Urlaubsbestätigung zum Ausdrucken / als PDF ---------- */

function naechsterWerktag(isoStart, richtung){
  const d = new Date(isoStart+'T00:00:00Z');
  for(let i=0; i<400; i++){
    d.setUTCDate(d.getUTCDate() + richtung);
    const iso = d.toISOString().slice(0,10);
    const tag = d.getUTCDay();
    if(tag !== 0 && tag !== 6 && !feiertage.has(iso)) return iso;
  }
  return '';
}

function urlaubsbestaetigung(id){
  const a = antragsDaten.find(x => x.id === id);
  if(!a) return;
  const m = personenNachId.get(a.mitarbeiter_id);

  const letzterArbeitstag = naechsterWerktag(a.von, -1);
  const ersterArbeitstag = naechsterWerktag(a.bis, +1);

  const fenster = window.open('', '_blank');
  if(!fenster){ alert('Das Fenster wurde vom Browser blockiert. Bitte Pop-ups für diese Seite erlauben.'); return; }
  fenster.document.write(`<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Urlaubsbestätigung ${esc(name)}</title>
<style>
  @page{ size:A4; margin:22mm 20mm; }

  .unterschriften div{ width:45%; border-top:1px solid #000; padding-top:.5em; text-align:center }
  @media print{ .drucken{ display:none } }
  .drucken{ margin-top:3em; padding:.7em 1.4em; font-size:12pt; cursor:pointer }
</style></head><body>
  <div class="kopf">
    <h1>URLAUBSBESTÄTIGUNG</h1>
    <div class="firma">G.A.B GmbH<br>Datum: ${formatDatum(heuteIso())}</div>
  </div>

  <div class="zeile">NAME: <span class="wert lang">${esc(name)}</span>

}

async function ladeAbwesenheiten(vonIso, bisIso, personId){
  let q = sb.from('abwesenheiten').select('mitarbeiter_id,art,von,bis,status')
    .lte('von', bisIso).gte('bis', vonIso).neq('status','abgelehnt');
  if(personId) q = q.eq('mitarbeiter_id', personId);
  const { data } = await q;
  return data || [];
}

function belegungBauen(liste){
  const karte = new Map();
  liste.forEach(a => {
    const d = new Date(a.von+'T00:00:00Z'), bis = new Date(a.bis+'T00:00:00Z');
    while(d <= bis){
      karte.set(`${a.mitarbeiter_id}|${d.toISOString().slice(0,10)}`, { art:a.art, status:a.status });
      d.setUTCDate(d.getUTCDate()+1);
    }
  });
  return karte;
}

function zelleBauen(iso, eintrag, titelName){
  const d = new Date(iso+'T00:00:00Z');
  const we = d.getUTCDay()===0 || d.getUTCDay()===6;
  const klassen = ['zelle'];
  if(eintrag){ klassen.push(eintrag.art); if(eintrag.status==='offen') klassen.push('offen'); }
  else if(we) klassen.push('we');
  else if(feiertage.has(iso)) klassen.push('feiertag');
  const titel = eintrag ? `${titelName}${eintrag.art} am ${formatDatum(iso)}`
    : (feiertage.has(iso) ? esc(feiertage.get(iso)) : formatDatum(iso));
  return `<td class="${klassen.join(' ')}" title="${titel}"></td>`;
}

async function zeichneMonat(leute){
  const tage = new Date(kalJahr, kalMonat+1, 0).getDate();
  const mm = String(kalMonat+1).padStart(2,'0');
  const belegung = belegungBauen(await ladeAbwesenheiten(`${kalJahr}-${mm}-01`, `${kalJahr}-${mm}-${String(tage).padStart(2,'0')}`));

  const kopf = [];
  for(let t=1; t<=tage; t++){
    const d = new Date(Date.UTC(kalJahr, kalMonat, t));
    kopf.push(`<th class="tag-kopf ${d.getUTCDay()===0||d.getUTCDay()===6?'we':''}">${t}</th>`);
  }
  const zeilen = leute.map(m => {
    const zellen = [];
    for(let t=1; t<=tage; t++){
      const iso = `${kalJahr}-${mm}-${String(t).padStart(2,'0')}`;
      zellen.push(zelleBauen(iso, belegung.get(`${m.id}|${iso}`), esc(m.vollername)+': '));
    }
    return `<tr><td class="name-spalte">${esc(m.vollername)}</td>${zellen.join('')}</tr>`;
  });

  $('kal-inhalt').innerHTML = leute.length
    ? `<div class="tabelle-wrapper"><table class="kalender">
        <thead><tr><th class="name-spalte">${MONATE[kalMonat]} ${kalJahr}</th>${kopf.join('')}</tr></thead>
        <tbody>${zeilen.join('')}</tbody></table></div>`
    : '<p class="leer">Keine aktiven Mitarbeiter.</p>';
}

async function zeichneJahr(){
  if(!kalPerson){ $('kal-inhalt').innerHTML = '<p class="leer">Keine aktiven Mitarbeiter.</p>'; return; }
  const belegung = belegungBauen(await ladeAbwesenheiten(`${kalJahr}-01-01`, `${kalJahr}-12-31`, kalPerson));
  const kopf = [];
  for(let t=1; t<=31; t++) kopf.push(`<th class="tag-kopf">${t}</th>`);

  const zeilen = MONATE.map((name, mi) => {
    const tage = new Date(kalJahr, mi+1, 0).getDate();
    const zellen = [];
    for(let t=1; t<=31; t++){
      if(t > tage){ zellen.push('<td></td>'); continue; }
      const iso = `${kalJahr}-${String(mi+1).padStart(2,'0')}-${String(t).padStart(2,'0')}`;
      zellen.push(zelleBauen(iso, belegung.get(`${kalPerson}|${iso}`), ''));
    }
    return `<tr><td class="name-spalte">${name}</td>${zellen.join('')}</tr>`;
  });

  $('kal-inhalt').innerHTML = `<div class="tabelle-wrapper"><table class="kalender">
    <thead><tr><th class="name-spalte">${kalJahr}</th>${kopf.join('')}</tr></thead>
    <tbody>${zeilen.join('')}</tbody></table></div>`;
}

    e.preventDefault();

      abteilung: $('mb-abteilung').value,
      taetigkeit: $('mb-taetigkeit').value.trim() || null,

      kontokorrektur: Number($('mb-korrektur').value) || 0,

      telefon: $('mb-telefon').value.trim() || null,
      adresse: $('mb-adresse').value.trim() || null,
      sv_nummer: $('mb-sv').value.trim() || null,

    }).eq('id', m.id);
    if(error){ $('mb-fehler').textContent = error.message; return; }
    schliesseModal();
    if(m.id === meinKonto?.id) await ladeGrunddaten();
    await ladeMitarbeiterListe();
  });
}

/* ===================== Import ===================== */

function vorlageHerunterladen(){
  const csv = 'Dienstnummer;Vorname;Nachname;Geburtsdatum;Abteilung;Eintrittsdatum;Taetigkeit;Telefon;Adresse\n'
            + '126;Max;Mustermann;02.02.2006;Lager;01.03.2024;Staplerfahrer;0660 1234567;Musterstr. 1, 1010 Wien\n';
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'mitarbeiter-vorlage.csv'; a.click();
}

function spalte(zeile, ...namen){
  const keys = Object.keys(zeile);
  for(const n of namen){
    const k = keys.find(x => x.trim().toLowerCase() === n.toLowerCase());
    if(k !== undefined) return zeile[k];
  }
  return '';
}

function importDatei(e){
  const datei = e.target.files[0];
  if(!datei) return;
  const leser = new FileReader();
  leser.onload = ev => {
    const wb = XLSX.read(ev.target.result, { type:'binary', cellDates:true });
    importVorschau(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' }));
  };
  leser.readAsBinaryString(datei);
}

function importVorschau(rohzeilen){
  const ziel = $('import-vorschau');
  if(!rohzeilen.length){ ziel.innerHTML = '<p class="fehler">Die Datei enthält keine Zeilen.</p>'; return; }
  importZeilen = [];
  const probleme = [];
  rohzeilen.forEach((z,i) => {
    const e = {
      dienstnummer: String(spalte(z,'Dienstnummer','Nr')).trim(),
      vorname: String(spalte(z,'Vorname')).trim(),
      nachname: String(spalte(z,'Nachname')).trim(),
      geburtsdatum: parseDatumFlex(spalte(z,'Geburtsdatum')),
      abteilung: String(spalte(z,'Abteilung')).trim(),
      eintrittsdatum: parseDatumFlex(spalte(z,'Eintrittsdatum','Eintritt')),
      austrittsdatum: parseDatumFlex(spalte(z,'Austrittsdatum','Austritt')),
      taetigkeit: String(spalte(z,'Taetigkeit','Tätigkeit','Position')).trim(),
      telefon: String(spalte(z,'Telefon')).trim(),
      adresse: String(spalte(z,'Adresse')).trim()
    };
    const fehlt = ['dienstnummer','vorname','nachname','geburtsdatum','abteilung','eintrittsdatum'].filter(f => !e[f]);
    if(fehlt.length){ probleme.push(`Zeile ${i+2}: ${fehlt.join(', ')} fehlt oder ist unlesbar`); return; }
    if(!abteilungen.includes(e.abteilung)){ probleme.push(`Zeile ${i+2}: Abteilung „${e.abteilung}" gibt es nicht`); return; }
    importZeilen.push(e);
  });

  ziel.innerHTML = `
    ${probleme.length ? `<div class="hinweis">${probleme.length} Zeile(n) übersprungen:<br>${probleme.map(esc).join('<br>')}</div>` : ''}
    ${importZeilen.length ? `
      <div class="tabelle-wrapper"><table>
        <thead><tr><th>Nr.</th><th>Name</th><th>Geburtsdatum</th><th>Abteilung</th><th>Eintritt</th><th>Code</th></tr></thead>
        <tbody>${importZeilen.map(z => {
          const [j,m,t] = z.geburtsdatum.split('-');
          return `<tr><td class="zahl">${esc(z.dienstnummer)}</td><td>${esc(z.vorname)} ${esc(z.nachname)}</td>
            <td>${formatDatum(z.geburtsdatum)}</td><td>${esc(z.abteilung)}</td>
            <td>${formatDatum(z.eintrittsdatum)}</td><td class="zahl">${esc(z.dienstnummer+t+m+j.slice(-2))}</td></tr>`;
        }).join('')}</tbody></table></div>
      <button class="knopf" style="margin-top:1.1em" id="import-start">${importZeilen.length} Mitarbeiter anlegen</button>
      <div id="import-ergebnis"></div>` : '<p class="fehler">Keine gültigen Zeilen zum Importieren.</p>'}`;
  $('import-start')?.addEventListener('click', importStarten);
}

async function importStarten(){
  const knopf = $('import-start'); knopf.disabled = true;
  const ergebnisse = [];
  for(const z of importZeilen){
    knopf.textContent = `Lege an … (${ergebnisse.length+1}/${importZeilen.length})`;
    try { await edgeAufruf('mitarbeiter-anlegen', z); ergebnisse.push({ ok:true, z }); }
    catch(err){ ergebnisse.push({ ok:false, z, fehler: err.message }); }
  }
  const schief = ergebnisse.filter(r => !r.ok);
  $('import-ergebnis').innerHTML = `
    <div class="erfolg">${ergebnisse.length - schief.length} von ${ergebnisse.length} angelegt.</div>
    ${schief.length ? `<div class="hinweis" style="margin-top:1em">${schief.map(r => `${esc(r.z.vorname)} ${esc(r.z.nachname)}: ${esc(r.fehler)}`).join('<br>')}</div>` : ''}`;
  knopf.hidden = true; importZeilen = []; $('import-datei').value = '';
  await ladeMitarbeiterListe();
}

/* ===================== Auswertung ===================== */

async function renderAuswertung(){
  const jahr = new Date().getFullYear();
  const [{ data: leute }, { data: abw }] = await Promise.all([
    sb.from('mitarbeiter_uebersicht').select('*').order('vollername'),
    sb.from('abwesenheiten').select('mitarbeiter_id,art,von,werktage,status').eq('status','genehmigt')
  ]);
  const aktive = (leute||[]).filter(m => !m.austrittsdatum);
  const nachId = new Map((leute||[]).map(m => [m.id, m]));

  const proAbteilung = new Map();
  aktive.forEach(m => {
    const e = proAbteilung.get(m.abteilung) || { anzahl:0, anspruch:0, urlaub:0, krank:0, sonstige:0, rest:0 };
    e.anzahl++; e.anspruch += +m.urlaubsanspruch||0; e.urlaub += +m.konsumiert||0;
    e.krank += +m.krank||0; e.sonstige += +m.sonstige||0; e.rest += +m.urlaubskonto||0;
    proAbteilung.set(m.abteilung, e);
  });

  const krank = new Map();
  (abw||[]).filter(a => a.art==='Krank').forEach(a => {
    const e = krank.get(a.mitarbeiter_id) || { tage:0, faelle:0, tageJahr:0, faelleJahr:0 };
    e.tage += +a.werktage||0; e.faelle++;
    if(a.von.slice(0,4) === String(jahr)){ e.tageJahr += +a.werktage||0; e.faelleJahr++; }
    krank.set(a.mitarbeiter_id, e);
  });
  const krankListe = [...krank.entries()].map(([id,e]) => ({ person:nachId.get(id), ...e }))
    .filter(x => x.person).sort((a,b) => b.tage - a.tage);

  $('inhalt').innerHTML = `
    <div class="block"><h2>Nach Abteilung</h2>
      <div class="tabelle-wrapper"><table>
        <thead><tr><th>Abteilung</th><th class="rechts">Mitarbeiter</th><th class="rechts">Anspruch</th>
          <th class="rechts">Urlaub</th><th class="rechts">Krank</th><th class="rechts">Sonstige</th><th class="rechts">Resturlaub</th></tr></thead>
        <tbody>${[...proAbteilung.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([n,e]) => `<tr>
          <td>${esc(n)}</td><td class="rechts">${e.anzahl}</td>
          <td class="rechts">${formatZahl(e.anspruch,0)}</td><td class="rechts">${formatZahl(e.urlaub,0)}</td>
          <td class="rechts">${formatZahl(e.krank,0)}</td><td class="rechts">${formatZahl(e.sonstige,0)}</td>
          <td class="rechts" style="color:var(--orange);font-weight:600">${formatZahl(e.rest,0)}</td></tr>`).join('')}</tbody>
      </table></div></div>

    <div class="block"><h2>Krankenstand</h2>
      ${krankListe.length ? `<div class="tabelle-wrapper"><table>
        <thead><tr><th>Mitarbeiter</th><th>Abteilung</th><th class="rechts">Tage ${jahr}</th>
          <th class="rechts">Fälle ${jahr}</th><th class="rechts">Tage gesamt</th><th class="rechts">Fälle gesamt</th></tr></thead>
        <tbody>${krankListe.map(k => `<tr>
          <td>${esc(k.person.vollername)}</td><td>${esc(k.person.abteilung)}</td>
          <td class="rechts">${formatZahl(k.tageJahr,0)}</td><td class="rechts">${k.faelleJahr}</td>
          <td class="rechts">${formatZahl(k.tage,0)}</td><td class="rechts">${k.faelle}</td></tr>`).join('')}</tbody>
      </table></div>` : '<p class="leer">Noch keine Krankmeldungen erfasst.</p>'}</div>

    <div class="block"><h2>Urlaubskonten</h2>
      <div class="tabelle-wrapper"><table>
        <thead><tr><th>Mitarbeiter</th><th>Abteilung</th><th class="rechts">Anspruch</th>
          <th class="rechts">Verbraucht</th><th class="rechts">Korrektur</th><th class="rechts">Rest</th></tr></thead>
        <tbody>${aktive.map(m => `<tr>
          <td>${esc(m.vollername)}</td><td>${esc(m.abteilung)}</td>
          <td class="rechts">${formatZahl(m.urlaubsanspruch)}</td><td class="rechts">${formatZahl(m.konsumiert)}</td>
          <td class="rechts">${formatZahl(m.kontokorrektur)}</td>
          <td class="rechts" style="color:var(--orange);font-weight:600">${formatZahl(m.urlaubskonto)}</td></tr>`).join('')}</tbody>
      </table></div></div>`;
}

let dokLeute = [];
let dokDatei = null;
const DOK_ARTEN = { einstellung:'Neuer Mitarbeiter', kuendigung:'Kündigung',
  krankmeldung:'Krankmeldung', urlaubsantrag:'Urlaubsantrag', unbekannt:'Unbekannt' };

async function renderDokument(){
  dokDatei = null;
  const { data } = await sb.from('mitarbeiter_uebersicht')
    .select('id,vollername,vorname,nachname,austrittsdatum').order('vollername');
  dokLeute = (data||[]).filter(m => !m.austrittsdatum);

  $('inhalt').innerHTML = `
    <div class="block">
      <h2>Dokument auslesen</h2>
      <p class="leer">PDF oder Foto einer Anmeldung, Kündigung, Krankmeldung oder eines Urlaubsantrags. Es wird nur ein Vorschlag erzeugt – gespeichert wird erst mit „Übernehmen".</p>
      <div class="dokument-aktion">
        <div id="dok-upload" class="dokument-upload" role="button" tabindex="0"
             aria-label="PDF oder Bild auswählen oder hier ablegen">
          <input id="dok-datei" type="file" accept=".pdf,image/*" hidden>
          <span class="dokument-upload-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
          </span>
          <span class="dokument-upload-text">
            <strong id="dok-datei-titel">Datei hier ablegen</strong>
            <span id="dok-datei-info">oder klicken zum Auswählen · PDF, JPG oder PNG</span>
          </span>
          <button class="dokument-datei-entfernen" type="button" id="dok-datei-entfernen">Entfernen</button>
        </div>
        <button class="knopf" type="button" id="dok-lesen" disabled>Auslesen</button>
      </div>
      <p class="fehler" id="dok-fehler"></p>
      <div id="dok-ergebnis"></div>
    </div>`;
  const upload = $('dok-upload');
  const eingabe = $('dok-datei');
  upload.addEventListener('click', e => {
    if(!e.target.closest('#dok-datei-entfernen')) eingabe.click();
  });
  upload.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); eingabe.click(); }
  });
  eingabe.addEventListener('change', () => dokumentDateiSetzen(eingabe.files[0]));
  ['dragenter','dragover'].forEach(name => upload.addEventListener(name, e => {
    e.preventDefault(); e.stopPropagation(); upload.classList.add('drag-aktiv');
  }));
  upload.addEventListener('dragleave', e => {
    if(!upload.contains(e.relatedTarget)) upload.classList.remove('drag-aktiv');
  });
  upload.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation(); upload.classList.remove('drag-aktiv');
    dokumentDateiSetzen(e.dataTransfer.files[0]);
  });
  $('dok-datei-entfernen').addEventListener('click', e => {
    e.stopPropagation(); dokumentDateiSetzen(null);
  });
  $('dok-lesen').addEventListener('click', dokumentLesen);
}

function dokumentDateiSetzen(datei){
  const upload = $('dok-upload');
  const eingabe = $('dok-datei');
  const fehler = $('dok-fehler');
  fehler.textContent = '';

  const dateiErlaubt = !datei || datei.type === 'application/pdf' || datei.type.startsWith('image/') ||
    /\.(pdf|png|jpe?g|webp|heic)$/i.test(datei.name);
  if(!dateiErlaubt){
    dokDatei = null;
    eingabe.value = '';
    upload.classList.remove('hat-datei');
    $('dok-datei-titel').textContent = 'Datei hier ablegen';
    $('dok-datei-info').textContent = 'oder klicken zum Auswählen · PDF, JPG oder PNG';
    $('dok-lesen').disabled = true;
    fehler.textContent = 'Bitte eine PDF- oder Bilddatei auswählen.';
    return;
  }

  dokDatei = datei || null;
  if(!dokDatei){
    eingabe.value = '';
    upload.classList.remove('hat-datei');
    $('dok-datei-titel').textContent = 'Datei hier ablegen';
    $('dok-datei-info').textContent = 'oder klicken zum Auswählen · PDF, JPG oder PNG';
    $('dok-lesen').disabled = true;
    return;
  }

  upload.classList.add('hat-datei');
  $('dok-datei-titel').textContent = dokDatei.name;
  $('dok-datei-info').textContent = `${dokDatei.type === 'application/pdf' ? 'PDF' : 'Bild'} · ${dateigroesse(dokDatei.size)} · bereit zum Auslesen`;
  $('dok-lesen').disabled = false;
}

function dateigroesse(bytes){
  if(bytes < 1024) return `${bytes} B`;
  if(bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1).replace('.', ',')} MB`;
}

async function dokumentLesen(){
  const datei = dokDatei || $('dok-datei').files[0];
  const fehler = $('dok-fehler');
  fehler.textContent = ''; $('dok-ergebnis').innerHTML = '';
  if(!datei){ fehler.textContent = 'Bitte zuerst eine Datei auswählen.'; return; }
  const knopf = $('dok-lesen'); knopf.disabled = true; knopf.textContent = 'Lese …';
  try {
    dokumentErgebnis(await edgeAufruf('hyper-handler', {
      dateiBase64: await dateiZuBase64(datei), mediaType: datei.type }));
  } catch(err){ fehler.textContent = 'Auslesen fehlgeschlagen: ' + err.message; }
  finally { knopf.disabled = !dokDatei; knopf.textContent = 'Auslesen'; }
}

        <div class="feld" id="dok-f-vorname"><label>Vorname</label><input id="dok-vorname" value="${esc(d.vorname||'')}"></div>
        <div class="feld" id="dok-f-nachname"><label>Nachname</label><input id="dok-nachname" value="${esc(d.nachname||'')}"></div>
        <div class="feld" id="dok-f-dienstnummer"><label>Dienstnummer</label><input id="dok-dienstnummer" inputmode="numeric" value="${esc(d.dienstnummer||'')}"></div>
        <div class="feld" id="dok-f-geburtsdatum"><label>Geburtsdatum${d.sv_nummer ? ' (aus SV-Nr.)' : ''}</label><input id="dok-geburtsdatum" type="date" value="${esc(d.geburtsdatum||'')}"></div>
        <div class="feld" id="dok-f-abteilung"><label>Abteilung *</label>
          <select id="dok-abteilung"><option value="">— bitte wählen —</option>

            ${['Vollzeit','Teilzeit','Geringfügig'].map(x => {

              return `<option ${passt?'selected':''}>${x}</option>`; }).join('')}</select></div>
        <div class="feld" id="dok-f-wochenstunden"><label>Wochenstunden</label><input id="dok-wochenstunden" type="number" step="0.5" value="${esc(String(d.wochenstunden||'').replace(',','.'))}"></div>
        <div class="feld" id="dok-f-sv"><label>SV-Nummer</label><input id="dok-sv" value="${esc(d.sv_nummer||'')}"></div>

        <div class="feld" id="dok-f-telefon"><label>Telefon</label><input id="dok-telefon" value="${esc(d.telefon||'')}"></div>

function dokFelder(){
  const art = $('dok-art').value;
  const neu = art === 'einstellung';
  const abwesenheit = art === 'krankmeldung' || art === 'urlaubsantrag';
  const zeig = (id, an) => { $(id).hidden = !an; };
  zeig('dok-f-person', !neu && art !== 'unbekannt');
  ['dok-f-vorname','dok-f-nachname','dok-f-dienstnummer','dok-f-geburtsdatum','dok-f-abteilung',
   'dok-f-taetigkeit','dok-f-beschaeftigung','dok-f-wochenstunden','dok-f-sv','dok-f-staat',
   'dok-f-telefon','dok-f-adresse'].forEach(id => zeig(id, neu));
  zeig('dok-f-von', art !== 'unbekannt');
  zeig('dok-f-bis', abwesenheit);
  $('dok-label-von').textContent = neu ? 'Eintrittsdatum' : art==='kuendigung' ? 'Austrittsdatum' : 'Von';
}

async function dokumentUebernehmen(){
  const art = $('dok-art').value;
  const fehler = $('dok-u-fehler');
  fehler.textContent = ''; $('dok-u-erfolg').innerHTML = '';
  try {
    if(art === 'einstellung'){
      if(!$('dok-abteilung').value) throw new Error('Bitte eine Abteilung wählen – die steht nicht im Dokument.');
      const ergebnis = await edgeAufruf('mitarbeiter-anlegen', {
        dienstnummer: $('dok-dienstnummer').value.trim(), geburtsdatum: $('dok-geburtsdatum').value,
        vorname: $('dok-vorname').value.trim(), nachname: $('dok-nachname').value.trim(),
        abteilung: $('dok-abteilung').value, eintrittsdatum: $('dok-von').value,
        taetigkeit: $('dok-taetigkeit').value.trim(), beschaeftigung: $('dok-beschaeftigung').value,
        wochenstunden: $('dok-wochenstunden').value, sv_nummer: $('dok-sv').value.trim(),
        staatsangehoerigkeit: $('dok-staat').value.trim(), telefon: $('dok-telefon').value.trim(),
        adresse: $('dok-adresse').value.trim() });
      $('dok-u-erfolg').innerHTML = `<div class="erfolg">Mitarbeiter angelegt. Anmelde-Code: <strong class="zahl" style="font-size:1.1rem">${esc(ergebnis.code)}</strong></div>`;

    } else if(art === 'kuendigung'){
      const id = $('dok-person').value, austritt = $('dok-von').value;
      if(!id || !austritt) throw new Error('Bitte Mitarbeiter und Austrittsdatum angeben.');
      const { error } = await sb.from('mitarbeiter').update({ austrittsdatum: austritt }).eq('id', id);
      if(error) throw new Error(error.message);
      $('dok-u-erfolg').innerHTML = `<div class="erfolg">Austrittsdatum gespeichert.</div>`;

    } else if(art === 'krankmeldung' || art === 'urlaubsantrag'){
      const id = $('dok-person').value, von = $('dok-von').value;
      const bis = $('dok-bis').value || von;
      if(!id || !von) throw new Error('Bitte Mitarbeiter und Zeitraum angeben.');
      const werktage = werktageZaehlen(von, bis);
      if(werktage <= 0) throw new Error('In diesem Zeitraum liegt kein Werktag.');
      const { error } = await sb.from('abwesenheiten').insert({
        mitarbeiter_id:id, art: art==='krankmeldung' ? 'Krank' : 'Urlaub', von, bis, werktage, status:'offen' });
      if(error) throw new Error(error.message);
      $('dok-u-erfolg').innerHTML = `<div class="erfolg">Als offener Antrag eingetragen – noch im Reiter „Anträge" genehmigen.</div>`;

    } else throw new Error('Art unbekannt – bitte manuell im passenden Reiter eintragen.');

    dokumentDateiSetzen(null);
  } catch(err){ fehler.textContent = err.message; }
}

/* ===================== Feiertage ===================== */

let feiertagJahr = new Date().getFullYear();

async function renderFeiertage(){
  const jahre = [...new Set([...feiertage.keys()].map(d => +d.slice(0,4)))].sort((a,b)=>b-a);
  $('inhalt').innerHTML = `
    <div class="block">
      <h2>Feiertag hinzufügen</h2>
      <form id="ft-form" class="formular-reihe" style="margin-top:1em">
        <div class="feld"><label>Datum</label><input id="ft-datum" type="date" required></div>
        <div class="feld" style="min-width:220px"><label>Bezeichnung</label><input id="ft-name" required></div>
        <button class="knopf" type="submit">Hinzufügen</button>
      </form>
      <p class="fehler" id="ft-fehler"></p>
    </div>
    <div class="block">
      <div class="block-kopf"><h2>Feiertage</h2>
        <div class="feld"><select id="ft-jahr">${jahre.map(j=>`<option ${j===feiertagJahr?'selected':''}>${j}</option>`).join('')}</select></div></div>
      <div id="ft-liste"></div>
    </div>`;
  $('ft-form').addEventListener('submit', feiertagHinzufuegen);
  $('ft-jahr').addEventListener('change', e => { feiertagJahr = +e.target.value; ladeFeiertagsListe(); });
  await ladeFeiertagsListe();
}

async function ladeFeiertagsListe(){
  const { data } = await sb.from('feiertage').select('*')
    .gte('datum', `${feiertagJahr}-01-01`).lte('datum', `${feiertagJahr}-12-31`).order('datum');
  const ziel = $('ft-liste');
  if(!data?.length){ ziel.innerHTML = '<p class="leer">Für dieses Jahr sind keine Feiertage hinterlegt.</p>'; return; }
  ziel.innerHTML = `<div class="tabelle-wrapper"><table>
    <thead><tr><th>Datum</th><th>Bezeichnung</th><th></th></tr></thead>
    <tbody>${data.map(f => `<tr><td>${formatDatum(f.datum)}</td><td>${esc(f.bezeichnung)}</td>
      <td><button class="knopf gefahr klein" data-ft="${f.id}">Löschen</button></td></tr>`).join('')}</tbody></table></div>`;
  ziel.querySelectorAll('[data-ft]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Diesen Feiertag wirklich löschen?')) return;
    await sb.from('feiertage').delete().eq('id', b.dataset.ft);
    await ladeGrunddaten(); await ladeFeiertagsListe();
  }));
}

async function feiertagHinzufuegen(e){
  e.preventDefault();
  const fehler = $('ft-fehler'); fehler.textContent = '';
  const { error } = await sb.from('feiertage').insert({
    datum: $('ft-datum').value, bezeichnung: $('ft-name').value.trim() });
  if(error){ fehler.textContent = error.message; return; }
  $('ft-form').reset();
  await ladeGrunddaten(); await ladeFeiertagsListe();
}

init();
</script>
