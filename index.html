<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urlaub Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef1f7; --karte:#ffffff; --text:#161a2c; --muted:#5c6478;
  --akzent:#3350e0; --akzent-dunkel:#283fc0; --akzent-licht:#eaedfd; --rand:#e2e6f0;
  --gruen:#15803d; --rot:#c0291b; --gelb:#b45309; --gelb-bg:#fef3c7;
  --gruen-bg:#dcfce7; --rot-bg:#fde3e0;
  --radius:12px; --schatten:0 1px 2px rgba(20,24,45,.04), 0 8px 24px rgba(20,24,45,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .5em 0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:.95rem;padding:.6em .7em;border:1px solid var(--rand);border-radius:8px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:none;border-color:var(--akzent);box-shadow:0 0 0 3px var(--akzent-licht)}
.fehler{color:var(--rot);font-size:.88rem;min-height:1.2em}

.logo-marke{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--akzent),var(--akzent-dunkel));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;flex-shrink:0;box-shadow:0 4px 12px rgba(51,80,224,.3)}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5em}
#login-karte{background:var(--karte);padding:2.4em 2.2em;border-radius:18px;box-shadow:var(--schatten);width:min(380px,100%)}
#login-kopf{display:flex;align-items:center;gap:.8em;margin-bottom:1.6em}
#login-kopf h1{font-size:1.25rem;margin:0}
#login-kopf p{margin:0;color:var(--muted);font-size:.85rem}
#rollen-umschalter{display:flex;background:var(--bg);border-radius:10px;padding:.25em;margin-bottom:1.6em}
#rollen-umschalter button{flex:1;background:none;border:none;padding:.6em;border-radius:8px;color:var(--muted);font-weight:600;font-size:.88rem;transition:all .15s}
#rollen-umschalter button.rolle-aktiv{background:#fff;color:var(--akzent);box-shadow:0 1px 3px rgba(20,24,45,.1)}
.login-formular{display:flex;flex-direction:column;gap:.9em}
.login-formular input{padding:.75em .8em}
.login-formular button[type=submit]{background:var(--akzent);color:#fff;border:none;border-radius:8px;padding:.8em;font-weight:700;margin-top:.3em;transition:background .15s}
.login-formular button[type=submit]:hover{background:var(--akzent-dunkel)}
#login-hinweis-mitarbeiter{color:var(--muted);font-size:.82rem;margin:-.3em 0 0}

header{display:flex;align-items:center;justify-content:space-between;padding:.9em 1.5em;background:var(--karte);border-bottom:1px solid var(--rand);position:sticky;top:0;z-index:10}
.kopf-links{display:flex;align-items:center;gap:.7em}
header h1{font-size:1.1rem;margin:0}
.kopf-rechts{display:flex;align-items:center;gap:1em;color:var(--muted);font-size:.88rem}
#abmelden{background:none;border:1px solid var(--rand);border-radius:8px;padding:.45em .95em;color:var(--text);font-weight:500}
#abmelden:hover{background:var(--bg)}

#tabs{display:flex;gap:.2em;padding:.5em 1.5em;background:var(--karte);border-bottom:1px solid var(--rand);overflow-x:auto}
#tabs button{background:none;border:none;padding:.65em 1em;color:var(--muted);font-weight:600;font-size:.9rem;border-radius:8px;white-space:nowrap;transition:all .15s}
#tabs button:hover{background:var(--bg);color:var(--text)}
#tabs button.tab-aktiv{color:var(--akzent);background:var(--akzent-licht)}

main{padding:1.8em;max-width:1140px;margin:0 auto}
.karten-reihe{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1em;margin-bottom:1.5em}
.karte{background:var(--karte);border-radius:var(--radius);padding:1.3em;box-shadow:var(--schatten)}
.karte .zahl{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.karte .label{color:var(--muted);font-size:.84rem;margin-top:.25em;font-weight:500}

.block{background:var(--karte);border-radius:var(--radius);padding:1.4em;box-shadow:var(--schatten);margin-bottom:1.5em}
.block h2{font-size:1.05rem}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.7em .6em;border-bottom:1px solid var(--rand)}
th{color:var(--muted);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
tbody tr:hover{background:var(--bg)}
tr:last-child td{border-bottom:none}
.tabelle-wrapper{overflow-x:auto}

.formular-reihe{display:flex;flex-wrap:wrap;gap:.7em;align-items:end;margin-bottom:1em}
.feld{display:flex;flex-direction:column;gap:.35em}
.feld label{font-size:.8rem;color:var(--muted);font-weight:500}
.knopf{background:var(--akzent);color:#fff;border:none;border-radius:8px;padding:.6em 1.2em;font-weight:600;transition:background .15s}
.knopf:hover{background:var(--akzent-dunkel)}
.knopf.sekundaer{background:none;border:1px solid var(--rand);color:var(--text)}
.knopf.sekundaer:hover{background:var(--bg)}
.knopf.gefahr{background:var(--rot)}
.knopf.gefahr:hover{background:#9f2115}
.knopf.klein{padding:.4em .75em;font-size:.82rem}

.badge{display:inline-block;padding:.25em .65em;border-radius:999px;font-size:.76rem;font-weight:700}
.status-offen{background:var(--gelb-bg);color:var(--gelb)}
.status-genehmigt{background:var(--gruen-bg);color:var(--gruen)}
.status-abgelehnt{background:var(--rot-bg);color:var(--rot)}

.umschalter{display:flex;gap:.3em;margin-bottom:1em;background:var(--bg);display:inline-flex;padding:.25em;border-radius:9px}
.umschalter button{background:none;border:none;padding:.45em 1em;border-radius:7px;color:var(--muted);font-size:.85rem;font-weight:600}
.umschalter button.aktiv{background:#fff;color:var(--akzent);box-shadow:0 1px 3px rgba(20,24,45,.1)}

.hinweis{background:var(--gelb-bg);color:var(--gelb);padding:.85em 1.1em;border-radius:10px;font-size:.9rem;margin-bottom:1.5em;font-weight:500}

#modal-hintergrund{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;padding:1em;z-index:50}
#modal{background:#fff;border-radius:16px;padding:1.8em;width:min(440px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal .formular-reihe{flex-direction:column;align-items:stretch}
#modal .feld{width:100%}
#modal .feld input,#modal .feld select{width:100%}

[hidden]{display:none!important}
@media(max-width:640px){ main{padding:1em} header{padding:.8em 1em} #tabs{padding:.4em 1em} }
</style>
</head>
<body>

<div id="login">
  <div id="login-karte">
    <div id="login-kopf">
      <div class="logo-marke">UT</div>
      <div>
        <h1>Urlaub Tool</h1>
        <p>Urlaubs- &amp; Abwesenheitsverwaltung</p>
      </div>
    </div>
    <div id="rollen-umschalter">
      <button type="button" data-rolle="mitarbeiter" class="rolle-aktiv">Mitarbeiter</button>
      <button type="button" data-rolle="verwalter">Verwalter</button>
    </div>

    <form id="login-form-mitarbeiter" class="login-formular">
      <input id="login-code" type="text" inputmode="numeric" placeholder="Code" autocomplete="username" required>
      <p id="login-hinweis-mitarbeiter">Dein Code: Dienstnummer + Geburtstag + Geburtsmonat + Geburtsjahr (2-stellig), ohne Leerzeichen. Beispiel: Dienstnummer 126, geboren 02.02.2006 → 126020206.</p>
      <button type="submit">Anmelden</button>
      <p class="fehler" id="login-fehler-mitarbeiter"></p>
    </form>

    <form id="login-form-verwalter" class="login-formular" hidden>
      <input id="login-email" type="email" placeholder="E-Mail" autocomplete="username">
      <input id="login-pass" type="password" placeholder="Passwort" autocomplete="current-password">
      <button type="submit">Anmelden</button>
      <p class="fehler" id="login-fehler-verwalter"></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="kopf-links">
      <div class="logo-marke">UT</div>
      <h1>Urlaub Tool</h1>
    </div>
    <div class="kopf-rechts">
      <span id="wer-bin-ich"></span>
      <button id="abmelden">Abmelden</button>
    </div>
  </header>
  <nav id="tabs">
    <button data-tab="start" class="tab-aktiv">Start</button>
    <button data-tab="antraege">Anträge</button>
    <button data-tab="mitarbeiter" class="nur-verwalter" hidden>Mitarbeiter</button>
    <button data-tab="feiertage" class="nur-verwalter" hidden>Feiertage</button>
    <button data-tab="dokument" class="nur-verwalter" hidden>Dokument</button>
  </nav>
  <main>
    <section id="tab-start"></section>
    <section id="tab-antraege" hidden></section>
    <section id="tab-mitarbeiter" hidden></section>
    <section id="tab-feiertage" hidden></section>
    <section id="tab-dokument" hidden></section>
  </main>
</div>

<div id="modal-hintergrund" hidden>
  <div id="modal"></div>
</div>

<script>
const SUPABASE_URL = "https://sggfkahjuzhyietgoeqh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_zsH7fXxMPozvmfVUZyDyqg_kyd0LFqM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let ich = null;
let meinMitarbeiter = null;
let istVerwalter = false;
let feiertageSet = new Set();
let abteilungenListe = [];
let nurAktiveMitarbeiter = true;
let antraegeFilter = 'offen';

function formatDatum(iso){
  if(!iso) return '';
  const [j,m,t] = iso.split('-');
  return `${t}.${m}.${j}`;
}
function formatZahl(n){
  return Number(n).toLocaleString('de-AT',{maximumFractionDigits:1});
}
function werktageZaehlen(vonStr, bisStr){
  const von = new Date(vonStr+'T00:00:00Z');
  const bis = new Date(bisStr+'T00:00:00Z');
  if(isNaN(von)||isNaN(bis)||bis<von) return 0;
  let n=0;
  const d = new Date(von);
  while(d<=bis){
    const tag = d.getUTCDay();
    const iso = d.toISOString().slice(0,10);
    if(tag!==0 && tag!==6 && !feiertageSet.has(iso)) n++;
    d.setUTCDate(d.getUTCDate()+1);
  }
  return n;
}

function zeigeModal(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-hintergrund').hidden = false;
}
function schliesseModal(){
  document.getElementById('modal-hintergrund').hidden = true;
  document.getElementById('modal').innerHTML = '';
}
document.getElementById('modal-hintergrund').addEventListener('click', e=>{
  if(e.target.id==='modal-hintergrund') schliesseModal();
});

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await angemeldet(session.user); else zeigeLogin();
}

function zeigeLogin(){
  document.getElementById('app').hidden = true;
  document.getElementById('login').hidden = false;
}

async function angemeldet(user){
  ich = user;
  document.getElementById('login').hidden = true;
  document.getElementById('app').hidden = false;
  await ladeGrunddaten();
  tabWechseln('start');
}

async function ladeGrunddaten(){
  const { data: m } = await sb.from('mitarbeiter_uebersicht').select('*').eq('email', ich.email).maybeSingle();
  meinMitarbeiter = m || null;

  if(meinMitarbeiter){
    istVerwalter = meinMitarbeiter.rolle === 'verwalter';
  } else {
    // Ohne eigenen Datensatz nur dann Verwalter, wenn die Tabelle wirklich leer ist
    // (Ersteinrichtung) – sonst würde die App Rechte vorgaukeln, die die Datenbank verweigert.
    const { count } = await sb.from('mitarbeiter').select('id', { count:'exact', head:true });
    istVerwalter = !count;
  }

  document.getElementById('wer-bin-ich').textContent = meinMitarbeiter ? meinMitarbeiter.vollername : ich.email;
  document.querySelectorAll('.nur-verwalter').forEach(el => el.hidden = !istVerwalter);

  const { data: f } = await sb.from('feiertage').select('datum');
  feiertageSet = new Set((f||[]).map(x=>x.datum));

  const { data: abt } = await sb.from('abteilungen').select('name').order('name');
  abteilungenListe = (abt||[]).map(x=>x.name);
}

function tabWechseln(name){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('tab-aktiv', b.dataset.tab===name));
  document.querySelectorAll('main section').forEach(s=>s.hidden = s.id !== 'tab-'+name);
  if(name==='start') renderStart();
  if(name==='antraege') renderAntraege();
  if(name==='mitarbeiter') renderMitarbeiter();
  if(name==='feiertage') renderFeiertage();
  if(name==='dokument') renderDokument();
}

async function renderStart(){
  const el = document.getElementById('tab-start');
  if(!istVerwalter){
    if(!meinMitarbeiter){
      el.innerHTML = `<div class="hinweis">Für deine E-Mail-Adresse gibt es noch keinen Mitarbeiter-Datensatz. Bitte an den Verwalter wenden.</div>`;
      return;
    }
    const m = meinMitarbeiter;
    el.innerHTML = `
      <div class="karten-reihe">
        <div class="karte"><div class="zahl">${formatZahl(m.urlaubskonto)}</div><div class="label">Urlaubskonto (Tage)</div></div>
        <div class="karte"><div class="zahl">${formatZahl(m.urlaubsanspruch)}</div><div class="label">Urlaubsanspruch gesamt</div></div>
        <div class="karte"><div class="zahl">${formatZahl(m.konsumiert)}</div><div class="label">Konsumierte Urlaubstage</div></div>
        <div class="karte"><div class="zahl">${formatZahl(m.krank)}</div><div class="label">Krankheitstage</div></div>
        <div class="karte"><div class="zahl">${formatZahl(m.sonstige)}</div><div class="label">Sonstige Abwesenheit</div></div>
        <div class="karte"><div class="zahl">${m.tage_in_firma}</div><div class="label">Tage in der Firma</div></div>
      </div>
      <div class="block">
        <h2>Eintrittsdatum</h2>
        <p>${formatDatum(m.eintrittsdatum)} · Abteilung: ${m.abteilung}</p>
      </div>`;
    return;
  }
  const { data, error } = await sb.from('mitarbeiter_uebersicht').select('*').order('vollername');
  if(error){ el.innerHTML = `<div class="hinweis">${error.message}</div>`; return; }
  const aktive = (data||[]).filter(m=>!m.austrittsdatum);
  el.innerHTML = `
    <div class="block">
      <h2>Übersicht aktive Mitarbeiter (${aktive.length})</h2>
      <div class="tabelle-wrapper"><table>
        <thead><tr><th>Name</th><th>Abteilung</th><th>Anspruch</th><th>Konsumiert</th><th>Krank</th><th>Sonstige</th><th>Konto</th></tr></thead>
        <tbody>
          ${aktive.map(m=>`<tr>
            <td>${m.vollername}</td><td>${m.abteilung}</td>
            <td>${formatZahl(m.urlaubsanspruch)}</td><td>${formatZahl(m.konsumiert)}</td>
            <td>${formatZahl(m.krank)}</td><td>${formatZahl(m.sonstige)}</td>
            <td><strong>${formatZahl(m.urlaubskonto)}</strong></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
}

async function renderAntraege(){
  const el = document.getElementById('tab-antraege');
  if(!istVerwalter){
    if(!meinMitarbeiter){
      el.innerHTML = `<div class="hinweis">Für deine E-Mail-Adresse gibt es noch keinen Mitarbeiter-Datensatz. Bitte an den Verwalter wenden.</div>`;
      return;
    }
    el.innerHTML = `
      <div class="block">
        <h2>Neuen Antrag stellen</h2>
        <form id="neuer-antrag-form" class="formular-reihe">
          <div class="feld"><label>Art</label>
            <select id="na-art"><option>Urlaub</option><option>Krank</option><option>Sonstige</option></select>
          </div>
          <div class="feld"><label>Von</label><input id="na-von" type="date" required></div>
          <div class="feld"><label>Bis</label><input id="na-bis" type="date" required></div>
          <div class="feld"><label>Werktage</label><input id="na-werktage" type="text" readonly value="0" style="width:4em"></div>
          <button class="knopf" type="submit">Beantragen</button>
        </form>
        <p class="fehler" id="na-fehler"></p>
      </div>
      <div class="block">
        <h2>Meine Anträge</h2>
        <div id="meine-antraege-liste"></div>
      </div>`;
    const von = document.getElementById('na-von');
    const bis = document.getElementById('na-bis');
    const vorschau = () => { document.getElementById('na-werktage').value = (von.value&&bis.value) ? werktageZaehlen(von.value,bis.value) : 0; };
    von.addEventListener('change', vorschau);
    bis.addEventListener('change', vorschau);
    document.getElementById('neuer-antrag-form').addEventListener('submit', neuerAntragAbsenden);
    await ladeEigeneAntraege();
    return;
  }

  el.innerHTML = `
    <div class="block">
      <div class="umschalter">
        <button data-filter="offen" class="${antraegeFilter==='offen'?'aktiv':''}">Offen</button>
        <button data-filter="alle" class="${antraegeFilter==='alle'?'aktiv':''}">Alle</button>
      </div>
      <div id="verwalter-antraege-liste"></div>
    </div>`;
  el.querySelectorAll('.umschalter button').forEach(b=>b.addEventListener('click', ()=>{ antraegeFilter=b.dataset.filter; renderAntraege(); }));
  await ladeAlleAntraege();
}

async function ladeEigeneAntraege(){
  const { data, error } = await sb.from('abwesenheiten')
    .select('*').eq('mitarbeiter_id', meinMitarbeiter.id).order('erstellt_am', { ascending:false });
  const ziel = document.getElementById('meine-antraege-liste');
  if(error){ ziel.innerHTML = error.message; return; }
  if(!data.length){ ziel.innerHTML = '<p style="color:var(--muted)">Noch keine Anträge.</p>'; return; }
  ziel.innerHTML = `<div class="tabelle-wrapper"><table>
    <thead><tr><th>Art</th><th>Von</th><th>Bis</th><th>Werktage</th><th>Status</th><th></th></tr></thead>
    <tbody>${data.map(a=>`<tr>
      <td>${a.art}</td><td>${formatDatum(a.von)}</td><td>${formatDatum(a.bis)}</td><td>${a.werktage}</td>
      <td><span class="badge status-${a.status}">${a.status}</span></td>
      <td>${a.status==='offen' ? `<button class="knopf sekundaer klein" onclick="antragZurueckziehen('${a.id}')">Zurückziehen</button>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

async function ladeAlleAntraege(){
  let q = sb.from('abwesenheiten').select('*, mitarbeiter!abwesenheiten_mitarbeiter_id_fkey(vorname,nachname)').order('erstellt_am', { ascending:false });
  if(antraegeFilter==='offen') q = q.eq('status','offen');
  const { data, error } = await q;
  const ziel = document.getElementById('verwalter-antraege-liste');
  if(error){ ziel.innerHTML = error.message; return; }
  if(!data.length){ ziel.innerHTML = '<p style="color:var(--muted)">Keine Anträge.</p>'; return; }
  ziel.innerHTML = `<div class="tabelle-wrapper"><table>
    <thead><tr><th>Mitarbeiter</th><th>Art</th><th>Von</th><th>Bis</th><th>Werktage</th><th>Status</th><th></th></tr></thead>
    <tbody>${data.map(a=>`<tr>
      <td>${a.mitarbeiter ? a.mitarbeiter.vorname+' '+a.mitarbeiter.nachname : '—'}</td>
      <td>${a.art}</td><td>${formatDatum(a.von)}</td><td>${formatDatum(a.bis)}</td><td>${a.werktage}</td>
      <td><span class="badge status-${a.status}">${a.status}</span></td>
      <td>${a.status==='offen' ? `
        <button class="knopf klein" onclick="antragEntscheiden('${a.id}','genehmigt')">Genehmigen</button>
        <button class="knopf gefahr klein" onclick="antragEntscheiden('${a.id}','abgelehnt')">Ablehnen</button>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

async function neuerAntragAbsenden(e){
  e.preventDefault();
  const art = document.getElementById('na-art').value;
  const von = document.getElementById('na-von').value;
  const bis = document.getElementById('na-bis').value;
  const werktage = werktageZaehlen(von,bis);
  const fehlerEl = document.getElementById('na-fehler');
  fehlerEl.textContent = '';
  if(werktage<=0){ fehlerEl.textContent = 'Der Zeitraum enthält keinen Werktag.'; return; }
  const { error } = await sb.from('abwesenheiten').insert({
    mitarbeiter_id: meinMitarbeiter.id, art, von, bis, werktage, status:'offen'
  });
  if(error){ fehlerEl.textContent = error.message; return; }
  await renderAntraege();
}

async function antragZurueckziehen(id){
  if(!confirm('Diesen Antrag wirklich zurückziehen?')) return;
  await sb.from('abwesenheiten').delete().eq('id', id);
  await ladeEigeneAntraege();
}

async function antragEntscheiden(id, status){
  await sb.from('abwesenheiten').update({
    status, bearbeitet_von: meinMitarbeiter.id, bearbeitet_am: new Date().toISOString()
  }).eq('id', id);
  await ladeAlleAntraege();
}

async function renderMitarbeiter(){
  const el = document.getElementById('tab-mitarbeiter');
  el.innerHTML = `
    <div class="block">
      <h2>Neuen Mitarbeiter anlegen</h2>

function importVorlageHerunterladen(){

  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mitarbeiter-vorlage.csv';
  a.click();
}

function parseDatumFlex(val){
  if(val===null || val===undefined || val==='') return null;
  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0,10);
  const s = String(val).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[.,/](\d{1,2})[.,/](\d{2,4})$/);
  if(m){
    let [,t,mo,j] = m;
    if(j.length===2) j = '20'+j;
    return `${j.padStart(4,'0')}-${mo.padStart(2,'0')}-${t.padStart(2,'0')}`;
  }
  return null;
}

let importZeilen = [];

function importDateiAusgewaehlt(e){
  const datei = e.target.files[0];
  if(!datei) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const wb = XLSX.read(ev.target.result, { type:'binary', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rohzeilen = XLSX.utils.sheet_to_json(ws, { defval:'' });
    verarbeiteImportZeilen(rohzeilen);
  };
  reader.readAsBinaryString(datei);
}

function spaltenWert(zeile, ...namen){
  const keys = Object.keys(zeile);
  for(const name of namen){
    const key = keys.find(k => k.trim().toLowerCase() === name.toLowerCase());
    if(key !== undefined) return zeile[key];
  }
  return '';
}

async function verarbeiteImportZeilen(rohzeilen){
  const ziel = document.getElementById('import-vorschau');
  if(!rohzeilen.length){
    ziel.innerHTML = '<p class="fehler">Die Datei enthält keine Zeilen.</p>';
    return;
  }
  const { data: bestehende } = await sb.from('mitarbeiter').select('vorname,nachname');
  const bestehendeSet = new Set((bestehende||[]).map(m => (m.vorname+' '+m.nachname).trim().toLowerCase()));

  importZeilen = [];
  const fehlerZeilen = [];
  rohzeilen.forEach((z, idx) => {
    const vorname = String(spaltenWert(z,'Vorname')).trim();
    const nachname = String(spaltenWert(z,'Nachname')).trim();
    const abteilung = String(spaltenWert(z,'Abteilung')).trim();
    const eintrittRoh = spaltenWert(z,'Eintrittsdatum');
    const austrittRoh = spaltenWert(z,'Austrittsdatum');
    const korrekturRoh = spaltenWert(z,'Kontokorrektur');
    const eintritt = parseDatumFlex(eintrittRoh);
    const austritt = austrittRoh ? parseDatumFlex(austrittRoh) : null;
    const dupe = bestehendeSet.has((vorname+' '+nachname).trim().toLowerCase());

    if(!vorname || !nachname || !abteilung || !eintritt){
      fehlerZeilen.push({ zeile: idx+2, grund: !eintritt && eintrittRoh ? `Eintrittsdatum "${eintrittRoh}" nicht lesbar` : 'Vorname, Nachname, Abteilung oder Eintrittsdatum fehlt' });
      return;
    }
    importZeilen.push({
      vorname, nachname, abteilung, eintrittsdatum: eintritt,
      austrittsdatum: austritt, kontokorrektur: parseFloat(korrekturRoh) || 0,
      dupe
    });
  });

  let html = '';
  if(fehlerZeilen.length){
    html += `<div class="hinweis">${fehlerZeilen.length} Zeile(n) übersprungen: ${fehlerZeilen.map(f=>`Zeile ${f.zeile} (${f.grund})`).join(', ')}</div>`;
  }
  if(!importZeilen.length){
    html += '<p class="fehler">Keine gültigen Zeilen zum Importieren.</p>';
    ziel.innerHTML = html;
    return;
  }
  const neue = importZeilen.filter(z=>!z.dupe).length;
  const dupes = importZeilen.filter(z=>z.dupe).length;
  html += `<div class="block" style="margin-top:1em">
    <p>${neue} neue Mitarbeiter werden angelegt${dupes?`, ${dupes} bereits vorhandene (gleicher Name) werden übersprungen`:''}.</p>
    <div class="tabelle-wrapper"><table>
      <thead><tr><th>Name</th><th>Abteilung</th><th>Eintritt</th><th>Austritt</th><th>Korrektur</th><th>Status</th></tr></thead>
      <tbody>${importZeilen.map(z=>`<tr>
        <td>${z.vorname} ${z.nachname}</td><td>${z.abteilung}</td><td>${formatDatum(z.eintrittsdatum)}</td>
        <td>${z.austrittsdatum?formatDatum(z.austrittsdatum):'—'}</td><td>${z.kontokorrektur}</td>
        <td>${z.dupe?'<span class="badge status-abgelehnt">existiert schon</span>':'<span class="badge status-genehmigt">neu</span>'}</td>
      </tr>`).join('')}</tbody></table></div>
    <button class="knopf" style="margin-top:1em" onclick="importBestaetigen()">${neue} Mitarbeiter importieren</button>
  </div>`;
  ziel.innerHTML = html;
}

async function importBestaetigen(){
  const neue = importZeilen.filter(z=>!z.dupe).map(({dupe, ...rest})=>rest);
  if(!neue.length) return;
  const { error } = await sb.from('mitarbeiter').insert(neue);
  const ziel = document.getElementById('import-vorschau');
  if(error){ ziel.innerHTML = `<p class="fehler">${error.message}</p>`; return; }
  ziel.innerHTML = `<div class="hinweis" style="background:var(--gruen-bg);color:var(--gruen)">${neue.length} Mitarbeiter erfolgreich importiert.</div>`;
  document.getElementById('import-datei').value = '';
  importZeilen = [];
  await ladeMitarbeiterListe();
}

async function neuerMitarbeiterAbsenden(e){
  e.preventDefault();
  const fehlerEl = document.getElementById('nm-fehler');
  fehlerEl.textContent = '';
  const rolle = document.getElementById('nm-rolle').value;
  const vorname = document.getElementById('nm-vorname').value.trim();
  const nachname = document.getElementById('nm-nachname').value.trim();
  const abteilung = document.getElementById('nm-abteilung').value;
  const eintrittsdatum = document.getElementById('nm-eintritt').value;

  if(rolle === 'mitarbeiter'){
    const dienstnummer = document.getElementById('nm-dienstnummer').value.trim();
    const geburtsdatum = document.getElementById('nm-geburtsdatum').value;
    if(!dienstnummer || !geburtsdatum){ fehlerEl.textContent = 'Dienstnummer und Geburtsdatum sind nötig.'; return; }
    const { data: { session } } = await sb.auth.getSession();
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/mitarbeiter-anlegen`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
      body: JSON.stringify({ dienstnummer, geburtsdatum, vorname, nachname, abteilung, eintrittsdatum, rolle })
    });
    const ergebnis = await resp.json();
    if(!resp.ok || ergebnis.error){ fehlerEl.textContent = ergebnis.error || 'Anlegen fehlgeschlagen'; return; }
  } else {
    const email = document.getElementById('nm-email').value.trim();
    if(!email){ fehlerEl.textContent = 'E-Mail ist nötig.'; return; }
    const { error } = await sb.from('mitarbeiter').insert({ email, vorname, nachname, abteilung, eintrittsdatum, rolle });
    if(error){ fehlerEl.textContent = error.message; return; }
  }

  document.getElementById('neuer-mitarbeiter-form').reset();
  nmFelderAnpassen();
  await ladeMitarbeiterListe();
}

let dokumentMitarbeiterListe = [];
const DOK_ART_LABEL = { einstellung:'Neuer Mitarbeiter', kuendigung:'Kündigung', krankmeldung:'Krankmeldung', urlaubsantrag:'Urlaubsantrag', unbekannt:'Unbekannt' };

function dateiZuBase64(datei){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(datei);
  });
}

async function dokumentLesen(){
  const input = document.getElementById('dok-datei');
  const datei = input.files[0];
  const fehlerEl = document.getElementById('dok-fehler');
  fehlerEl.textContent = '';
  document.getElementById('dok-ergebnis').innerHTML = '';
  if(!datei){ fehlerEl.textContent = 'Bitte eine Datei auswählen.'; return; }
  const knopf = document.getElementById('dok-lesen-knopf');
  knopf.disabled = true; knopf.textContent = 'Lese...';
  try{
    const dateiBase64 = await dateiZuBase64(datei);
    const { data, error } = await sb.functions.invoke('hyper-handler', { body: { dateiBase64, mediaType: datei.type } });
    if(error) throw error;
    if(data.error) throw new Error(data.error);
    zeigeDokumentErgebnis(data);
  }catch(e){
    fehlerEl.textContent = 'Fehler beim Lesen: ' + (e.message || e);
  }finally{
    knopf.disabled = false; knopf.textContent = 'Lesen lassen';
  }
}

function zeigeDokumentErgebnis(d){
  const art = DOK_ART_LABEL[d.art] ? d.art : 'unbekannt';
  const gefunden = dokumentMitarbeiterListe.find(m =>
    (m.vorname||'').trim().toLowerCase() === (d.vorname||'').trim().toLowerCase() &&
    (m.nachname||'').trim().toLowerCase() === (d.nachname||'').trim().toLowerCase());

  document.getElementById('dok-ergebnis').innerHTML = `
    <div class="block" style="margin-top:1em">
      ${d.sicherheit==='niedrig' || art==='unbekannt' ? `<div class="hinweis">Die KI ist sich unsicher${d.hinweis?(': '+d.hinweis):''}. Bitte besonders genau prüfen oder manuell im passenden Reiter eintragen.</div>` : ''}
      <form id="dok-form" class="formular-reihe">
        <div class="feld"><label>Art</label>
          <select id="dok-art">${Object.entries(DOK_ART_LABEL).map(([k,v])=>`<option value="${k}" ${k===art?'selected':''}>${v}</option>`).join('')}</select>
        </div>
        <div class="feld" id="dok-feld-mitarbeiter" style="min-width:220px"><label>Mitarbeiter</label>
          <select id="dok-mitarbeiter">
            <option value="">— auswählen —</option>
            ${dokumentMitarbeiterListe.map(m=>`<option value="${m.id}" ${gefunden&&gefunden.id===m.id?'selected':''}>${m.vorname} ${m.nachname}</option>`).join('')}
          </select>
        </div>
        <div class="feld" id="dok-feld-vorname"><label>Vorname</label><input id="dok-vorname" value="${d.vorname||''}"></div>
        <div class="feld" id="dok-feld-nachname"><label>Nachname</label><input id="dok-nachname" value="${d.nachname||''}"></div>
        <div class="feld" id="dok-feld-abteilung"><label>Abteilung</label>
          <select id="dok-abteilung">${abteilungenListe.map(a=>`<option ${a===d.abteilung?'selected':''}>${a}</option>`).join('')}</select>
        </div>
        <div class="feld" id="dok-feld-von"><label id="dok-label-von">Datum</label><input id="dok-von" type="date" value="${d.datum_von||''}"></div>
        <div class="feld" id="dok-feld-bis"><label>Bis</label><input id="dok-bis" type="date" value="${d.datum_bis||''}"></div>
        <button class="knopf" type="submit">Übernehmen</button>
      </form>
      <p class="fehler" id="dok-uebernehmen-fehler"></p>
    </div>`;

  dokumentFelderAnpassen();
  document.getElementById('dok-art').addEventListener('change', dokumentFelderAnpassen);
  document.getElementById('dok-form').addEventListener('submit', dokumentUebernehmen);
}

function dokumentFelderAnpassen(){
  const art = document.getElementById('dok-art').value;
  const zeig = (id, an) => { document.getElementById(id).style.display = an ? '' : 'none'; };
  zeig('dok-feld-mitarbeiter', art !== 'einstellung');
  zeig('dok-feld-vorname', art === 'einstellung');
  zeig('dok-feld-nachname', art === 'einstellung');
  zeig('dok-feld-abteilung', art === 'einstellung');
  zeig('dok-feld-von', art !== 'unbekannt');
  zeig('dok-feld-bis', art === 'urlaubsantrag' || art === 'krankmeldung');
  document.getElementById('dok-label-von').textContent =
    art==='einstellung' ? 'Eintrittsdatum' : art==='kuendigung' ? 'Austrittsdatum' : 'Von';
}

async function dokumentUebernehmen(e){
  e.preventDefault();
  const art = document.getElementById('dok-art').value;
  const fehlerEl = document.getElementById('dok-uebernehmen-fehler');
  fehlerEl.textContent = '';

  if(art === 'einstellung'){
    const vorname = document.getElementById('dok-vorname').value.trim();
    const nachname = document.getElementById('dok-nachname').value.trim();
    const abteilung = document.getElementById('dok-abteilung').value;
    const eintrittsdatum = document.getElementById('dok-von').value;
    if(!vorname || !nachname || !eintrittsdatum){ fehlerEl.textContent = 'Vorname, Nachname und Eintrittsdatum sind nötig.'; return; }
    const { error } = await sb.from('mitarbeiter').insert({ vorname, nachname, abteilung, eintrittsdatum });
    if(error){ fehlerEl.textContent = error.message; return; }
  } else if(art === 'kuendigung'){
    const mitarbeiterId = document.getElementById('dok-mitarbeiter').value;
    const austrittsdatum = document.getElementById('dok-von').value;
    if(!mitarbeiterId || !austrittsdatum){ fehlerEl.textContent = 'Mitarbeiter und Austrittsdatum auswählen.'; return; }
    const { error } = await sb.from('mitarbeiter').update({ austrittsdatum }).eq('id', mitarbeiterId);
    if(error){ fehlerEl.textContent = error.message; return; }
  } else if(art === 'krankmeldung' || art === 'urlaubsantrag'){
    const mitarbeiterId = document.getElementById('dok-mitarbeiter').value;
    const von = document.getElementById('dok-von').value;
    const bis = document.getElementById('dok-bis').value || von;
    if(!mitarbeiterId || !von){ fehlerEl.textContent = 'Mitarbeiter und Datum auswählen.'; return; }
    const werktage = werktageZaehlen(von, bis);
    if(werktage<=0){ fehlerEl.textContent = 'Der Zeitraum enthält keinen Werktag.'; return; }
    const { error } = await sb.from('abwesenheiten').insert({
      mitarbeiter_id: mitarbeiterId, art: art==='krankmeldung'?'Krank':'Urlaub', von, bis, werktage, status:'offen'
    });
    if(error){ fehlerEl.textContent = error.message; return; }
  } else {
    fehlerEl.textContent = 'Art unbekannt – bitte manuell im passenden Reiter eintragen.';
    return;
  }

  document.getElementById('dok-ergebnis').innerHTML = `<div class="hinweis" style="background:var(--gruen-bg);color:var(--gruen)">Übernommen${art==='krankmeldung'||art==='urlaubsantrag'?' – als offener Antrag, muss noch genehmigt werden.':''}.</div>`;
  document.getElementById('dok-datei').value = '';
}

document.querySelectorAll('#rollen-umschalter button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#rollen-umschalter button').forEach(x=>x.classList.toggle('rolle-aktiv', x===b));
    document.getElementById('login-form-mitarbeiter').hidden = b.dataset.rolle !== 'mitarbeiter';
    document.getElementById('login-form-verwalter').hidden = b.dataset.rolle !== 'verwalter';
  });
});

document.getElementById('login-form-mitarbeiter').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fehlerEl = document.getElementById('login-fehler-mitarbeiter');
  fehlerEl.textContent = '';
  const code = document.getElementById('login-code').value.replace(/\D/g,'');
  if(code.length <= 6){ fehlerEl.textContent = 'Code ist zu kurz.'; return; }
  const dienstnummer = code.slice(0, -6);
  const password = code.slice(-6);
  const email = `ma${dienstnummer}@dienst.intern`;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ fehlerEl.textContent = 'Code stimmt nicht.'; return; }
  await angemeldet(data.user);
});

document.getElementById('login-form-verwalter').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const fehlerEl = document.getElementById('login-fehler-verwalter');
  fehlerEl.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ fehlerEl.textContent = 'Anmeldung fehlgeschlagen: ' + error.message; return; }
  await angemeldet(data.user);
});

document.getElementById('abmelden').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  ich = null; meinMitarbeiter = null;
  zeigeLogin();
});

document.querySelectorAll('#tabs button').forEach(b=>{
  b.addEventListener('click', ()=> tabWechseln(b.dataset.tab));
});

init();
</script>
</body>
</html>
